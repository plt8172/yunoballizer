[project]
name = "yunoballizer"
version = "0.1.0"
description = "Personal automation tool for collecting content from Instagram, YouTube Shorts, and TikTok"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "instaloader>=4.10",
    "yt-dlp>=2024.1.1",
    "browser_cookie3>=0.19",
]

[project.optional-dependencies]
curate = ["anthropic>=0.25.0"]

[project.scripts]
yunoballizer = "yunoballizer.cli:main"
yuno = "yunoballizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yunoballizer"]

[tool.hatch.build]
include = ["src/yunoballizer/templates/**/*.txt"]
